# Единственный источник данных о враче.
#
# Плейсхолдеры — две формы, других нет:
#   PH::текст     значение целиком не заполнено (префикс в вёрстку не попадает)
#   {{текст}}     не заполнена часть строки, остальное — готовый текст
# Если строка начинается с PH::, фигурные скобки в ней не разбираются.
# Всё помеченное рендерится с классом .ph (красный пунктир) и служит
# опросником для встречи с врачом. Выдумывать вместо плейсхолдера нельзя:
# стаж, цены и номер лицензии — категорически.
#
# Сколько осталось незаполненного:  grep -cE '^[^#]*(PH::|{{)' src/content/doctor.yaml

doctor:
  name: "PH::Фамилия Имя Отчество"
  short_name: "PH::Имя Отчество"
  city: "PH::Город"
  phone: "PH::+7 000 000-00-00"
  call_hours: "PH::часы, когда удобно звонить"
  experience_years: "PH::00"

  # Плашки hero. Значение стажа и города продублируйте из полей выше.
  badges:
    - "врач-педиатр"
    - "стаж {{00}} лет"
    - "{{Город}}"

  tagline: "PH::главная строка hero — собрать из её собственных формулировок"
  lead: >
    Разбираю ситуацию целиком: что беспокоит, что уже принимали, какие
    обследования действительно нужны. Назначаю то, что меняет исход,
    и объясняю, почему.

  about: >
    PH::два-три абзаца от первого лица. Источник — закреплённый пост
    «Куда вы попали». Почему педиатрия, отношение к назначениям,
    что главное в работе с родителями.

  credentials:
    - label: "Образование"
      value: "PH::вуз, год выпуска"
    - label: "Специализация"
      value: "PH::ординатура, год"
    - label: "Категория"
      value: "PH::квалификационная категория"
    - label: "Стаж"
      value: "PH::00 лет, из них 00 в частной практике"
    - label: "Повышение"
      value: "PH::курсы и сертификаты за последние 3 года"

  channels:
    - kind: vk
      url: "PH::ссылка"
      note: "основной канал для сообщений"
    - kind: telegram
      url: "PH::ссылка"
      note: "работает нестабильно из-за ограничений"
    # MAX — строку удалить целиком, если врач им не пользуется

  clinic:
    name: "PH::наименование клиники"
    address: "PH::адрес"
    directions: "PH::как найти вход, парковка"
    map_url: "PH::ссылка на Яндекс.Карты"

services:
  - id: online
    title: "Онлайн-консультация"
    description: >
      Разбор жалоб, расшифровка анализов, второе мнение по уже назначенному
      лечению. Подходит, когда осмотр не требуется.
    duration: "PH::00 минут"
    conditions: "PH::формат связи"
    price: "PH::0 000 ₽"
  - id: home
    title: "Выезд на дом"
    description: >
      Осмотр ребёнка дома в день обращения. Актуально при температуре,
      когда везти в клинику не стоит.
    duration: "PH::00 минут"
    conditions: "PH::районы выезда, время"
    price: "PH::0 000 ₽"
  - id: clinic
    title: "Приём в клинике"
    description: >
      Полный осмотр с оборудованием: отоскопия, аускультация,
      при необходимости экспресс-тесты.
    duration: "PH::00 минут"
    conditions: "PH::дни и часы приёма"
    price: "PH::0 000 ₽"

topics:
  - "частые ОРВИ"
  - "длительный кашель"
  - "боли в животе"
  - "атопический дерматит"
  - "аденоиды"
  - "температура без причины"
  - "сыпь"
  - "плохой аппетит"
  - "расшифровка анализов"
  - "второе мнение"
  - "PH::дополнить по её реальной практике"

visit_steps:
  - "Записываетесь по телефону или в мессенджере. Спрошу возраст ребёнка и что беспокоит — от этого зависит формат."
  - "Присылаете заранее выписки и результаты анализов, если они есть. Так на приёме останется время на разговор, а не на чтение бумаг."
  - "Приём: {{00 минут}}. Расспрос, осмотр, обсуждение вариантов."
  - "Получаете письменное заключение с назначениями и объяснением, что делать при ухудшении."
  - "Остаюсь на связи {{00 дней}} по вопросам, связанным с этим обращением."

principles:
  - myth: "Назначу анализы «на всякий случай»"
    answer: "PH::пояснение врача. Тезис есть в посте «9 анализов, которые я никогда не назначу»"
  - myth: "Пропишу иммуномодулятор от частых ОРВИ"
    answer: "PH::пояснение врача"
  - myth: "Пообещаю результат к конкретной дате"
    answer: "PH::пояснение врача"

legal:
  warning: "Имеются противопоказания. Необходима консультация специалиста."
  license_holder: "PH::ФИО или наименование ИП — лицензия у самого врача"
  license_number: "PH::№ 00-00-000000 от 00.00.0000"
  license_issuer: "PH::орган, выдавший лицензию"
  # Медицинскую лицензию выдают юрлицу или ИП. Самозанятый её получить не может,
  # так что вариант «самозанятый» здесь отпадает по факту наличия лицензии.
  entity: "PH::ИП Фамилия Имя Отчество"
  inn: "PH::000000000000"
  ogrnip: "PH::000000000000000"

seo:
  # 39 в никнейме — код Калининградской области. Уточнить регион приёма:
  # для частного врача геозапросы дают больше записей, чем всё остальное.
  region: "PH::регион"
  primary_query: "PH::педиатр <город>"

  # Домен нужен Astro для sitemap и canonical — без него сборка бессмысленна.
  site_url: "PH::https://example.ru"

  # <title> и <meta description> главной. В компонент их не поднимать.
  title: "PH::педиатр <город> — консультации онлайн, выезд на дом, приём в клинике"
  description: >
    PH::до 160 символов, с городом и главным запросом. Черновик:
    «Педиатр в <городе>. Онлайн-консультации, выезд на дом, приём в клинике.
    Разбор анализов, лечение без лишних назначений.»
